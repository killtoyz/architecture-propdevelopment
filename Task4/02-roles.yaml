
---
# Неймспейс домена sales
apiVersion: v1
kind: Namespace
metadata:
  name: sales
  labels:
    org/domain: sales
---
# Неймспейс домена housing
apiVersion: v1
kind: Namespace
metadata:
  name: housing
  labels:
    org/domain: housing
---
# Неймспейс домена finance
apiVersion: v1
kind: Namespace
metadata:
  name: finance
  labels:
    org/domain: finance
---
# Только чтение во всём кластере. Без secrets и без pods/log (в логах могут быть ПДн).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-viewer
  labels: {rbac.propdevelopment/managed: "true"}
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, configmaps, persistentvolumeclaims, events,
                serviceaccounts, resourcequotas, limitranges, replicationcontrollers,
                namespaces, nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
---
# Настройка кластера
# Без secrets, без RBAC, без рабочих нагрузок приложений.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-operator
  labels: {rbac.propdevelopment/managed: "true"}
rules:
  - apiGroups: [""]
    resources: [namespaces, persistentvolumes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, update, patch]       
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]                                
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch, create, update, patch, delete]
---
# Привилегированный просмотр для ИБ: секреты, RBAC, логи. Только чтение.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: security-auditor
  labels: {rbac.propdevelopment/managed: "true"}
rules:
  - apiGroups: [""]
    resources: [secrets, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
---
# Разработчик: управление Deployment, чтение логов и событий.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer
  namespace: sales
  labels: {rbac.propdevelopment/managed: "true"}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
# DevOps-инженер команды: всё, что у разработчика, плюс secrets,
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops
  namespace: sales
  labels: {rbac.propdevelopment/managed: "true"}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [create, get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
---
