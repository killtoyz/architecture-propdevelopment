
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-viewer-binding
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-viewer}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: cluster-viewers}
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: platform-operators}
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: security-auditors}
  - {kind: ServiceAccount, name: anna, namespace: users}
  - {kind: ServiceAccount, name: petr, namespace: users}
  - {kind: ServiceAccount, name: olga, namespace: users}
---
