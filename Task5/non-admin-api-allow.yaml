

# 1. Запрет всего входящего трафика ко всем подам неймспейса
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# 2. back-end-api принимает трафик только от front-end
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: back-end-api-allow-front-end
spec:
  podSelector:
    matchLabels: {role: back-end-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {role: front-end}
---
# 3. front-end принимает трафик только от back-end-api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: front-end-allow-back-end-api
spec:
  podSelector:
    matchLabels: {role: front-end}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {role: back-end-api}
---
# 4. admin-back-end-api принимает трафик только от admin-front-end
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-back-end-api-allow-admin-front-end
spec:
  podSelector:
    matchLabels: {role: admin-back-end-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {role: admin-front-end}
---
# 5. admin-front-end принимает трафик только от admin-back-end-api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-front-end-allow-admin-back-end-api
spec:
  podSelector:
    matchLabels: {role: admin-front-end}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {role: admin-back-end-api}
